[package]
name = "gpuix-android"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "gpuix_android"
crate-type = ["cdylib"]

[dependencies]
gpuix-native = { path = "../vendor/gpuix-native", default-features = false }
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.15"
log = "0.4"

[features]
default = ["http-client"]
http-client = ["gpuix-native/http-client"]
rich-content = ["gpuix-native/rich-content"]

[patch.crates-io]
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }

[profile.dev]
debug = 0
incremental = true

[profile.android-dev]
inherits = "release"
opt-level = 1
debug = 0
strip = "none"
lto = false
codegen-units = 16
incremental = true
panic = "abort"

[profile.android-dev.package."*"]
opt-level = 2

[profile.android-dev.package.gpuix-native]
opt-level = 1
codegen-units = 16

[profile.android-dev.package.gpui-mobile]
opt-level = 1
codegen-units = 16

[profile.release-fast]
inherits = "release"
lto = "thin"
codegen-units = 4

[profile.release]
opt-level = "z"
debug = 0
strip = "symbols"
lto = "fat"
codegen-units = 1
panic = "abort"
